<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão de Ciências - 3º Ano (Módulo 12)</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-light: #e8f5e9;
      --secondary: #1565c0;
      --accent: #f57c00;
      --text: #2c3e50;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --correct: #2e7d32;
      --incorrect: #c62828;
      --border-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #2e7d32, #43a047);
      color: white;
      padding: 25px 30px;
      text-align: center;
      position: relative;
    }

    header h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.3);
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #ffeb3b;
      transition: width 0.3s ease;
    }

    .quiz-body {
      padding: 30px;
      flex-grow: 1;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .badge {
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 25px;
      color: #1a252f;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background-color: #fff;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: var(--primary-light);
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: var(--primary-light);
      font-weight: 600;
    }

    .option-btn.correct {
      border-color: var(--correct);
      background-color: #e8f5e9;
      color: var(--correct);
      font-weight: 600;
    }

    .option-btn.incorrect {
      border-color: var(--incorrect);
      background-color: #ffebee;
      color: var(--incorrect);
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 14px;
      flex-shrink: 0;
      font-size: 0.85rem;
    }

    .feedback-box {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 25px;
      display: none;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .feedback-box.correct {
      background-color: #e8f5e9;
      border: 1px solid #a5d6a7;
      color: #1b5e20;
    }

    .feedback-box.incorrect {
      background-color: #ffebee;
      border: 1px solid #ef9a9a;
      color: #b71c1c;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary {
      background-color: #e0e0e0;
      color: #424242;
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #d5d5d5;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #236126;
    }

    .btn-confirm {
      background-color: var(--accent);
      color: white;
    }

    .btn-confirm:hover:not(:disabled) {
      background-color: #e65100;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Report Page */
    .report-container {
      display: none;
      padding: 30px;
      text-align: center;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--primary-light);
      border: 6px solid var(--primary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
    }

    .score-number {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--primary);
    }

    .score-label {
      font-size: 0.85rem;
      color: #555;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .stat-card {
      padding: 15px;
      border-radius: 12px;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
    }

    .stat-card h4 {
      font-size: 0.85rem;
      color: #6c757d;
      margin-bottom: 5px;
    }

    .stat-card p {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .study-guide {
      text-align: left;
      background-color: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .study-guide h3 {
      color: #f57f17;
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    .study-guide ul {
      padding-left: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .quiz-body, .report-container {
        padding: 20px;
      }
      .question-text {
        font-size: 1rem;
      }
      .btn {
        padding: 10px 16px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Revisão de Ciências - Módulo 12</h1>
      <p>Rochas, Fósseis, Formação e Tipos de Solo</p>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </header>

    <!-- Quiz View -->
    <div class="quiz-body" id="quiz-view">
      <div class="question-header">
        <span class="badge" id="question-badge">Questão 1 de 30</span>
        <span class="badge" id="topic-badge">Tópico</span>
      </div>

      <div class="question-text" id="question-text">
        Carregando pergunta...
      </div>

      <div class="options" id="options-container">
        <!-- Alternativas inseridas via JS -->
      </div>

      <div class="feedback-box" id="feedback-box">
        <!-- Feedback da questão -->
      </div>

      <div class="controls">
        <button class="btn btn-secondary" id="btn-prev" onclick="prevQuestion()" disabled>Anterior</button>
        <button class="btn btn-confirm" id="btn-confirm" onclick="confirmAnswer()">Confirmar Resposta</button>
        <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()" disabled>Próxima</button>
      </div>
    </div>

    <!-- Report View -->
    <div class="report-container" id="report-view">
      <h2>Relatório de Desempenho Final</h2>
      <p>Confira seu resultado final no quiz de revisão do livro!</p>

      <div class="score-circle">
        <span class="score-number" id="percentage-score">0%</span>
        <span class="score-label" id="score-text">0 de 30</span>
      </div>

      <div class="stats-grid">
        <div class="stat-card" style="border-left: 4px solid var(--correct);">
          <h4>Acertos</h4>
          <p id="correct-count" style="color: var(--correct);">0</p>
        </div>
        <div class="stat-card" style="border-left: 4px solid var(--incorrect);">
          <h4>Erros</h4>
          <p id="incorrect-count" style="color: var(--incorrect);">0</p>
        </div>
      </div>

      <div class="study-guide" id="study-guide">
        <h3>Direcionamento para Estudo</h3>
        <ul id="study-recommendations">
          <!-- Recomendações inseridas aqui -->
        </ul>
      </div>

      <button class="btn btn-primary" style="margin-top: 25px; width: 100%;" onclick="restartQuiz()">Refazer Quiz de Revisão</button>
    </div>
  </div>

  <script>
    const questions = [
      // Rochas e Minerais (Pág. 107)
      {
        topic: "Rochas e Minerais",
        question: "1. O que são as rochas que compõem a litosfera segundo o livro?",
        options: [
          "A) São restos de animais e plantas mortos no solo.",
          "B) São compostos líquidos que saem dos vulcões.",
          "C) São agregados de minerais, formando-se pela união de um ou mais tipos de mineral.",
          "D) São pedaços de plástico e vidro misturados à terra.",
          "E) São grãos formados exclusivamente por minhocas e cupins."
        ],
        correct: 2,
        explanation: "Na página 107, o livro define exatamente: 'As rochas que compõem a litosfera são agregados de minerais, ou seja, formam-se pela união de um ou mais tipos de mineral.'"
      },
      {
        topic: "Rochas e Minerais",
        question: "2. O que determina a variação na forma e na composição das rochas e também sua classificação?",
        options: [
          "A) A quantidade de água da chuva que cai sobre elas.",
          "B) O seu processo de formação.",
          "C) O tipo de animal que vive sobre a rocha.",
          "D) A quantidade de minhocas presentes ao redor.",
          "E) A cor das folhas das árvores no local."
        ],
        correct: 1,
        explanation: "Na página 107, o livro explica: 'A forma e a composição das rochas variam de acordo com seu processo de formação, que também determina sua classificação.'"
      },
      {
        topic: "Rochas e Minerais",
        question: "3. Em quais três grupos as rochas podem ser classifiedas?",
        options: [
          "A) Duras, moles e líquidas.",
          "B) Arenosas, argilosas e humíferas.",
          "C) Vermelhas, pretas e amareladas.",
          "D) Ígneas (ou magmáticas), metamórficas e sedimentares.",
          "E) Terrestres, marinhas e vulcânicas."
        ],
        correct: 3,
        explanation: "Conforme a página 107: 'As rochas podem ser classificadas em ígneas (ou magmáticas), metamórficas e sedimentares.'"
      },
      {
        topic: "Rochas e Minerais",
        question: "4. Como se formam as rochas ígneas ou magmáticas?",
        options: [
          "A) A partir do resfriamento e da solidificação do magma.",
          "B) Pela decomposição de restos de plantas.",
          "C) Pelo acúmulo de areia nos rios.",
          "D) Pela ação do vento sobre os fósseis.",
          "E) Pela mistura de barro com húmus."
        ],
        correct: 0,
        explanation: "Na página 107 lê-se: 'As rochas ígneas ou magmáticas se formam a partir do resfriamento e da solidificação do magma.'"
      },
      {
        topic: "Rochas e Minerais",
        question: "5. Qual é a diferença entre a formação do basalto e a do granito?",
        options: [
          "A) O basalto é feito de plantas e o granito é feito de minerais.",
          "B) O basalto forma-se no fundo do mar e o granito no deserto.",
          "C) O basalto é uma rocha sedimentar e o granito é uma rocha metamórfica.",
          "D) O basalto se forma rapidamente com a chuva e o granito leva bilhões de anos.",
          "E) O basalto se forma do magma que extravasa na superfície (lava), e o granito se forma no interior da crosta terrestre."
        ],
        correct: 4,
        explanation: "Página 107: 'O basalto é formado a partir do magma que extravasa da superfície terrestre, isto é, da lava. Já o granito se forma quando a solidificação do magma acontece no interior da crosta terrestre.'"
      },
      {
        topic: "Rochas e Minerais",
        question: "6. Quais são os exemplos de aplicação do basalto e do granito mostrados no livro?",
        options: [
          "A) O basalto é utilizado na produção de revestimentos para piso e o granito em pias.",
          "B) O basalto é usado para adubo e o granito para tijolos.",
          "C) Ambos são usados apenas para fabricar recipientes de vidro.",
          "D) O granito é usado em telhas e o basalto em garrafas.",
          "E) O basalto é usado para plantar café e o granito para plantar cana."
        ],
        correct: 0,
        explanation: "Nas legendas da página 107: 'O basalto é utilizado na produção de revestimentos para piso...' e 'O granito é utilizado na produção de revestimentos para pias...'"
      },
      {
        topic: "Rochas e Minerais",
        question: "7. Como o livro define o que é um mineral no quadro lateral da página 107?",
        options: [
          "A) Um resto orgânico de dinossauro.",
          "B) Um tipo de líquido encontrado nos vulcões.",
          "C) Um composto sólido natural, com estrutura de cristal.",
          "D) Um grão feito inteiramente de terra preta.",
          "E) Uma folha decomposta por fungos."
        ],
        correct: 2,
        explanation: "No box de definição da página 107: 'Mineral: composto sólido natural, com estrutura de cristal.'"
      },

      // Rochas Sedimentares e Fósseis (Pág. 109)
      {
        topic: "Rochas Sedimentares e Fósseis",
        question: "8. Há quantos anos os dinossauros surgiram e quando se extinguiram, segundo o texto da página 109?",
        options: [
          "A) Surgiram há 1 milhão de anos e se extinguiram há 10 mil anos.",
          "B) Surgiram há 500 anos e se extinguiram há 100 anos.",
          "C) Surgiram há 1 bilhão de anos e se extinguiram ontem.",
          "D) Surgiram há cerca de 200 milhões de anos e se extinguiram há aproximadamente 65 milhões de anos.",
          "E) Surgiram há 50 milhões de anos e se extinguiram há 2 milhões de anos."
        ],
        correct: 3,
        explanation: "Página 109: 'Os dinossauros surgiram há cerca de 200 milhões de anos e se extinguiram há, aproximadamente, 65 milhões de anos.'"
      },
      {
        topic: "Rochas Sedimentares e Fósseis",
        question: "9. De acordo com o livro, o que são fósseis?",
        options: [
          "A) Tipos de rochas vulcânicas recém-saídas do magma.",
          "B) Pequenos insetos vivos que moram no solo.",
          "C) Minerais brilhantes encontrados no granito.",
          "D) Restos ou vestígios de animais ou plantas conservados em diferentes superfícies, como rochas.",
          "E) Adubos artificiais colocados na terra."
        ],
        correct: 3,
        explanation: "Página 109: '...análise dos fósseis, que são restos ou vestígios de animais ou plantas conservados em diferentes superfícies, como rochas.'"
      },
      {
        topic: "Rochas Sedimentares e Fósseis",
        question: "10. O que significa 'deposição' e 'fossilização' de acordo com o vocabulário da página 109?",
        options: [
          "A) Deposição é a queima das rochas; Fossilização é a evaporação da água.",
          "B) Deposição é o surgimento de minhocas; Fossilização é a erupção vulcânica.",
          "C) Deposição é o acúmulo de sedimentos; Fossilização é a formação de fósseis.",
          "D) Deposição é o resfriamento da lava; Fossilização é o nascimento de plantas.",
          "E) Deposição é a formação de terra roxa; Fossilização é o cultivo de café."
        ],
        correct: 2,
        explanation: "No box de definições da página 109: 'Deposição: acúmulo.' e 'Fossilização: formação de fósseis.'"
      },
      {
        topic: "Rochas Sedimentares e Fósseis",
        question: "11. Em que tipo de rochas é possível encontrar fósseis e por quê?",
        options: [
          "A) Em rochas ígneas, pois o magma preserva os ossos.",
          "B) Em rochas do interior da crosta como o granito.",
          "C) Em qualquer tipo de rocha derretida por vulcões.",
          "D) Apenas em rochas sedimentares, pois durante a fossilização as partes moles são destruídas e as partes duras são substituídas por sedimentos.",
          "E) Somente no basalto usado para pisos."
        ],
        correct: 3,
        explanation: "Página 109: 'Por esse motivo, é possível encontrar fósseis apenas em rochas sedimentares.', pois as partes moles são destruídas e as partes duras são substituídas por sedimentos."
      },
      {
        topic: "Rochas Sedimentares e Fósseis",
        question: "12. Onde ocorrem as condições mais favoráveis para a formação de fósseis?",
        options: [
          "A) No topo de montanhas altas e secas.",
          "B) Em mares pouco profundos, embora também possa ocorrer em ambientes terrestres.",
          "C) Dentro do magma fervente dos vulcões.",
          "D) No fundo dos desertos sem nenhuma água.",
          "E) Nas pias de granito das casas."
        ],
        correct: 1,
        explanation: "Página 109: 'As condições mais favoráveis para a formação de fósseis ocorrem em mares pouco profundos, mas esse evento também pode ocorrer em ambientes terrestres.'"
      },

      // Formação e Composição do Solo (Pág. 112)
      {
        topic: "Formação do Solo",
        question: "13. O que é o solo de acordo com a introdução da página 112?",
        options: [
          "A) É apenas uma camada de areia seca.",
          "B) É uma mistura de vários componentes, incluindo rochas, minerais, matéria orgânica (restos de seres vivos) e água.",
          "C) É um composto feito unicamente de produtos químicos da fábrica.",
          "D) É o magma que resfriou na superfície da Terra.",
          "E) É uma folha de papel para registro escolar."
        ],
        correct: 1,
        explanation: "Página 112: 'O solo é uma mistura de vários componentes, incluindo rochas, minerais, matéria orgânica (restos de seres vivos) e água.'"
      },
      {
        topic: "Formação do Solo",
        question: "14. Como são chamadas as rochas que ficam na superfície da Terra e dão origem aos solos?",
        options: [
          "A) Rochas-filhas.",
          "B) Rochas-vulcão.",
          "C) Rochas-areia.",
          "D) Rochas-mãe.",
          "E) Rochas-cristal."
        ],
        correct: 3,
        explanation: "Página 112: 'Quando dão origem aos solos, as rochas são chamadas de rochas-mãe.'"
      },
      {
        topic: "Formação do Solo",
        question: "15. Quais fatores ambientais e ações causam o desgaste e fragmentação da rocha-mãe?",
        options: [
          "A) Apenas a luz da Lua.",
          "B) O uso de tratores e máquinas humanas.",
          "C) Chuva, vento, luz do Sol, mudanças de temperatura e a ação dos seres vivos (animais e plantas).",
          "D) O resfriamento do magma no centro da Terra.",
          "E) A quantidade de pedras de granito."
        ],
        correct: 2,
        explanation: "Página 112: '...expostas a fatores ambientais que causam a sua fragmentação, como a chuva, o vento, a luz do Sol, as mudanças de temperatura e a ação dos seres vivos (animais e plantas).'"
      },
      {
        topic: "Formação do Solo",
        question: "16. Quanto tempo demora o processo de formação do solo representado no esquema da página 112?",
        options: [
          "A) Poucos dias.",
          "B) Algumas semanas.",
          "C) Exatamente 10 anos.",
          "D) Ocorre da noite para o dia.",
          "E) Milhões de anos."
        ],
        correct: 4,
        explanation: "Página 112 (legenda do esquema): '...o qual demora milhões de anos para acontecer.'"
      },
      {
        topic: "Formação do Solo",
        question: "17. Como se compara a idade das camadas da superfície do solo com as camadas mais profundas?",
        options: [
          "A) As camadas da superfície do solo são as mais recentes.",
          "B) As camadas da superfície são as mais antigas de todas.",
          "C) Todas as camadas têm exatamente a mesma idade.",
          "D) A rocha-mãe é a camada mais recente.",
          "E) A superfície não tem camada de solo."
        ],
        correct: 0,
        explanation: "Página 112 (box de explicação): 'As camadas da superfície do solo são as mais recentes.'"
      },

      // Componentes do Solo (Pág. 113)
      {
        topic: "Componentes do Solo",
        question: "18. O solo completamente formado abriga várias formas de vida e é composto por uma mistura de:",
        options: [
          "A) Magma, lava, granito e tijolos.",
          "B) Fósseis, dinossauros, areia e plástico.",
          "C) Minerais, água, ar e matéria orgânica.",
          "D) Apenas pedras e água salgada.",
          "E) Basalto, feldspato e cerâmica."
        ],
        correct: 2,
        explanation: "Página 113 (box superior): 'Ele é composto de uma mistura de minerais, água, ar e matéria orgânica.'"
      },
      {
        topic: "Componentes do Solo",
        question: "19. Como se forma o húmus no solo recém-formado?",
        options: [
          "A) Pelo resfriamento rápido da lava do vulcão.",
          "B) Pela quebra de pedras de quartzito.",
          "C) A partir da decomposição dos restos de seres vivos (como plantas e animais) que se depositam no solo.",
          "D) Pela mistura de areia seca com barro de tijolo.",
          "E) Apenas pela ação da luz solar sobre as rochas."
        ],
        correct: 2,
        explanation: "Página 113: 'Os restos desses seres vivos, ao se depositarem no solo, são decompostos e formam o húmus...'"
      },
      {
        topic: "Componentes do Solo",
        question: "20. Quais são as características do húmus descritas no texto da página 113?",
        options: [
          "A) É um composto claro e seco, sem nutrientes.",
          "B) É um composto escuro e rico em nutrientes.",
          "C) É um cristal duro e avermelhado.",
          "D) É uma rocha magmática extremamente dura.",

    let currentQuestionIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let confirmedStatus = new Array(questions.length).fill(false);

    function loadQuestion() {
      const q = questions[currentQuestionIdx];
      
      document.getElementById('question-badge').innerText = `Questão ${currentQuestionIdx + 1} de ${questions.length}`;
      document.getElementById('topic-badge').innerText = q.topic;
      document.getElementById('question-text').innerText = q.question;
      
      // Update progress bar
      const progress = ((currentQuestionIdx + 1) / questions.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;

      // Render options
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        if (userAnswers[currentQuestionIdx] === idx) {
          btn.classList.add('selected');
        }

        // Apply style if confirmed
        if (confirmedStatus[currentQuestionIdx]) {
          btn.disabled = true;
          if (idx === q.correct) {
            btn.classList.add('correct');
          } else if (userAnswers[currentQuestionIdx] === idx) {
            btn.classList.add('incorrect');
          }
        }

        btn.onclick = () => selectOption(idx);

        const letterSpan = document.createElement('span');
        letterSpan.className = 'option-letter';
        letterSpan.innerText = String.fromCharCode(65 + idx);

        const textSpan = document.createElement('span');
        textSpan.innerText = opt.substring(3); // Remove A), B) prefix for clean view

        btn.appendChild(letterSpan);
        btn.appendChild(textSpan);
        optionsContainer.appendChild(btn);
      });

      // Controls setup
      document.getElementById('btn-prev').disabled = currentQuestionIdx === 0;
      
      const confirmBtn = document.getElementById('btn-confirm');
      const nextBtn = document.getElementById('btn-next');
      const feedbackBox = document.getElementById('feedback-box');

      if (confirmedStatus[currentQuestionIdx]) {
        confirmBtn.disabled = true;
        nextBtn.disabled = false;
        showFeedback();
      } else {
        confirmBtn.disabled = userAnswers[currentQuestionIdx] === null;
        nextBtn.disabled = true;
        feedbackBox.style.display = 'none';
      }

      if (currentQuestionIdx === questions.length - 1 && confirmedStatus[currentQuestionIdx]) {
        nextBtn.innerText = "Ver Relatório Final";
      } else {
        nextBtn.innerText = "Próxima";
      }
    }

    function selectOption(idx) {
      if (confirmedStatus[currentQuestionIdx]) return;
      userAnswers[currentQuestionIdx] = idx;
      
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, i) => {
        if (i === idx) {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }
      });

      document.getElementById('btn-confirm').disabled = false;
    }

    function confirmAnswer() {
      if (userAnswers[currentQuestionIdx] === null) return;
      
      confirmedStatus[currentQuestionIdx] = true;
      showFeedback();
      loadQuestion();
    }

    function showFeedback() {
      const q = questions[currentQuestionIdx];
      const selected = userAnswers[currentQuestionIdx];
      const feedbackBox = document.getElementById('feedback-box');
      
      feedbackBox.style.display = 'block';
      if (selected === q.correct) {
        feedbackBox.className = 'feedback-box correct';
        feedbackBox.innerHTML = `<strong>✨ Resposta Correta!</strong><br>${q.explanation}`;
      } else {
        feedbackBox.className = 'feedback-box incorrect';
        feedbackBox.innerHTML = `<strong>❌ Resposta Incorreta.</strong> A opção certa é a letra <strong>${String.fromCharCode(65 + q.correct)}</strong>.<br><strong>Explicação do Livro:</strong> ${q.explanation}`;
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < questions.length - 1) {
        currentQuestionIdx++;
        loadQuestion();
      } else {
        showReport();
      }
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        loadQuestion();
      }
    }

    function showReport() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('report-view').style.display = 'block';

      let correctCount = 0;
      let errorsByTopic = {};

      questions.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        } else {
          errorsByTopic[q.topic] = (errorsByTopic[q.topic] || 0) + 1;
        }
      });

      const incorrectCount = questions.length - correctCount;
      const percentage = Math.round((correctCount / questions.length) * 100);

      document.getElementById('percentage-score').innerText = `${percentage}%`;
      document.getElementById('score-text').innerText = `${correctCount} de ${questions.length} questões`;
      document.getElementById('correct-count').innerText = correctCount;
      document.getElementById('incorrect-count').innerText = incorrectCount;

      const recommendationsUl = document.getElementById('study-recommendations');
      recommendationsUl.innerHTML = '';

      if (incorrectCount === 0) {
        recommendationsUl.innerHTML = '<li><strong>Parabéns perfeito! 🎉</strong> Você demonstrou domínio completo de todo o conteúdo do livro. Continua assim!</li>';
      } else {
        if (errorsByTopic["Rochas e Minerais"]) {
          recommendationsUl.innerHTML += '<li><strong>Página 107 (Rochas e Minerais):</strong> Revisar a diferença entre basalto e granito, a definição de mineral e a classificação das rochas ígneas.</li>';
        }
        if (errorsByTopic["Rochas Sedimentares e Fósseis"]) {
          recommendationsUl.innerHTML += '<li><strong>Página 109 (Rochas Sedimentares e Fósseis):</strong> Revisar o processo de fossilização, deposição e por que fósseis só existem em rochas sedimentares.</li>';
        }
        if (errorsByTopic["Formação do Solo"]) {
          recommendationsUl.innerHTML += '<li><strong>Página 112 (Formação do Solo):</strong> Reforçar o conceito de rocha-mãe, a ação dos fatores ambientais (chuva, vento, sol) e a idade das camadas.</li>';
        }
        if (errorsByTopic["Componentes do Solo"]) {
          recommendationsUl.innerHTML += '<li><strong>Página 113 (Componentes do Solo):</strong> Rever os minerais (feldspato, quartzo, mica, argila, areia) e a formação do húmus a partir de seres vivos decompostos.</li>';
        }
        if (errorsByTopic["Tipos de Solo"]) {
          recommendationsUl.innerHTML += '<li><strong>Página 116 (Tipos de Solo):</strong> Reler com atenção as características e utilizações dos 5 tipos de solo: arenoso, argiloso, humífero (terra preta), terra roxa e massapê.</li>';
        }
      }
    }

    function restartQuiz() {
      currentQuestionIdx = 0;
      userAnswers = new Array(questions.length).fill(null);
      confirmedStatus = new Array(questions.length).fill(false);
      document.getElementById('quiz-view').style.display = 'block';
      document.getElementById('report-view').style.display = 'none';
      loadQuestion();
    }

    // Inicializa o quiz ao carregar a página
    window.onload = loadQuestion;
  </script>
